[project]
name = "consentvid"
version = "0.0.1"
description = "Consent-first video dataset platform on ATproto"
requires-python = ">=3.10"
dependencies = [
    "atproto>=0.0.55",
    "click>=8.1",
    "python-dotenv>=1.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
r2 = ["boto3>=1.34"]
c2pa = ["c2pa-python>=0.32", "cryptography>=42"]
dev = ["mlcroissant>=1.0", "boto3>=1.34", "c2pa-python>=0.32", "cryptography>=42"]

[project.scripts]
consentvid = "consentvid.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

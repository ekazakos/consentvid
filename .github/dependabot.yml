version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The consent web app's npm dependencies (app/package-lock.json).
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
  # The hashtag bot's npm dependencies (bot/package-lock.json).
  - package-ecosystem: npm
    directory: /bot
    schedule:
      interval: weekly

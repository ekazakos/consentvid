name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      # Pinned to full commit SHAs (tags are mutable); see .github/dependabot.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - name: Audit dependencies for known vulnerabilities
        run: pip install pip-audit && pip-audit --skip-editable
        continue-on-error: true  # report, don't block; make blocking once the baseline is clean
      - run: ruff check src tests
      - run: pytest -m "not network"
